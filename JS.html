  // =========================================================================
  // HERBRUIKBARE MULTI-SELECT DROPDOWN COMPONENT (VOOR ALLE DASHBOARDS)
  // =========================================================================
  (function() {
    function MultiSelect(config) {
      this.container = typeof config.container === 'string' ? document.getElementById(config.container) : config.container;
      if (!this.container) return;
      
      this.id = config.id || ('ms_' + Math.random().toString(36).substr(2, 9));
      this.placeholder = config.placeholder || 'Alle';
      this.allLabel = config.allLabel || 'Alle';
      this.onChange = config.onChange || function() {};
      this.styleType = config.styleType || 'boxed';
      this.options = [];
      this.selected = [];
      this.isOpen = false;
      
      this.init();
    }

    MultiSelect.prototype.init = function() {
      var self = this;
      this.container.innerHTML = '';
      this.container.classList.add('relative');

      var btnClass = (this.styleType === 'underline') 
        ? 'w-full border-b border-slate-300 pb-1 text-sm font-bold text-slate-700 bg-transparent flex items-center justify-between cursor-pointer focus:outline-none hover:border-[#D32F2F] transition-colors'
        : (this.styleType === 'compact')
          ? 'w-full border border-slate-300 p-2 rounded text-sm text-slate-700 bg-white flex items-center justify-between cursor-pointer focus:outline-none hover:border-[#D32F2F] transition-colors shadow-sm'
          : 'w-full border border-slate-300 p-2.5 rounded font-bold text-sm text-slate-700 bg-white flex items-center justify-between cursor-pointer focus:outline-none hover:border-[#D32F2F] transition-colors shadow-sm';

      this.hiddenInput = document.createElement('input');
      this.hiddenInput.type = 'hidden';
      this.hiddenInput.id = this.id;
      this.container.appendChild(this.hiddenInput);

      this.btn = document.createElement('button');
      this.btn.type = 'button';
      this.btn.className = btnClass;
      
      this.btnText = document.createElement('span');
      this.btnText.className = 'truncate flex items-center gap-1.5 text-left';
      this.btnText.innerText = this.placeholder;
      this.btn.appendChild(this.btnText);

      this.btnIcon = document.createElement('span');
      this.btnIcon.className = 'material-icons text-slate-400 text-base transition-transform duration-200 shrink-0';
      this.btnIcon.innerText = 'expand_more';
      this.btn.appendChild(this.btnIcon);

      this.container.appendChild(this.btn);

      this.panel = document.createElement('div');
      this.panel.className = 'hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-md shadow-2xl z-[9999] overflow-hidden min-w-[200px] max-w-[340px]';
      
      this.searchContainer = document.createElement('div');
      this.searchContainer.className = 'p-2 border-b border-slate-100 flex items-center gap-1 bg-slate-50';
      this.searchContainer.innerHTML = '<span class="material-icons text-slate-400 text-sm">search</span>';
      
      this.searchInput = document.createElement('input');
      this.searchInput.type = 'text';
      this.searchInput.placeholder = 'Zoeken...';
      this.searchInput.className = 'w-full text-xs bg-transparent outline-none text-slate-700 font-normal';
      this.searchContainer.appendChild(this.searchInput);
      this.panel.appendChild(this.searchContainer);

      var actionBar = document.createElement('div');
      actionBar.className = 'flex justify-between items-center px-2.5 py-1.5 bg-slate-100 border-b border-slate-200 text-[11px] font-semibold text-slate-600';
      
      var btnSelectAll = document.createElement('button');
      btnSelectAll.type = 'button';
      btnSelectAll.className = 'text-blue-600 hover:text-blue-800 transition-colors font-medium';
      btnSelectAll.innerText = 'Alles selecteren';
      btnSelectAll.addEventListener('click', function(e) {
        e.stopPropagation();
        self.selectAll();
      });

      var btnClear = document.createElement('button');
      btnClear.type = 'button';
      btnClear.className = 'text-slate-500 hover:text-red-600 transition-colors font-medium';
      btnClear.innerText = 'Wissen';
      btnClear.addEventListener('click', function(e) {
        e.stopPropagation();
        self.clear();
      });

      actionBar.appendChild(btnSelectAll);
      actionBar.appendChild(btnClear);
      this.panel.appendChild(actionBar);

      this.listContainer = document.createElement('div');
      this.listContainer.className = 'max-h-52 overflow-y-auto custom-scrollbar p-1';
      this.panel.appendChild(this.listContainer);

      this.container.appendChild(this.panel);

      this.btn.addEventListener('click', function(e) {
        e.stopPropagation();
        self.toggle();
      });

      this.searchInput.addEventListener('input', function() {
        self.filterItems(this.value);
      });

      document.addEventListener('click', function(e) {
        if (!self.container.contains(e.target)) {
          self.close();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && self.isOpen) {
          self.close();
        }
      });
    };

    MultiSelect.prototype.toggle = function() {
      if (this.isOpen) {
        this.close();
      } else {
        this.open();
      }
    };

    MultiSelect.prototype.open = function() {
      if (window.activeMultiSelect && window.activeMultiSelect !== this) {
        window.activeMultiSelect.close();
      }
      this.panel.classList.remove('hidden');
      this.btnIcon.style.transform = 'rotate(180deg)';
      this.isOpen = true;
      window.activeMultiSelect = this;
      if (this.options.length > 5) {
        this.searchInput.value = '';
        this.filterItems('');
        this.searchInput.focus();
      }
    };

    MultiSelect.prototype.close = function() {
      this.panel.classList.add('hidden');
      this.btnIcon.style.transform = '';
      this.isOpen = false;
      if (window.activeMultiSelect === this) {
        window.activeMultiSelect = null;
      }
    };

    MultiSelect.prototype.setOptions = function(opts, selected, triggerChange) {
      this.options = opts ? [...opts] : [];
      if (Array.isArray(selected)) {
        this.selected = selected.filter(s => this.options.indexOf(s) > -1);
      } else if (typeof selected === 'string' && selected && selected !== 'Alle' && this.options.indexOf(selected) > -1) {
        this.selected = [selected];
      } else {
        this.selected = [];
      }
      
      this.searchContainer.style.display = this.options.length > 5 ? 'flex' : 'none';
      
      this.renderList();
      this.updateButton();
      
      if (triggerChange) {
        this.onChange(this.selected);
      }
    };

    MultiSelect.prototype.renderList = function() {
      var self = this;
      this.listContainer.innerHTML = '';
      
      if (this.options.length === 0) {
        var emptyEl = document.createElement('div');
        emptyEl.className = 'py-3 text-center text-xs text-slate-400 italic';
        emptyEl.innerText = 'Geen opties beschikbaar';
        this.listContainer.appendChild(emptyEl);
        return;
      }

      this.options.forEach(function(opt) {
        var row = document.createElement('label');
        row.className = 'flex items-center gap-2 px-2.5 py-1.5 hover:bg-slate-100 rounded cursor-pointer text-xs transition-colors select-none';
        
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'accent-[#D32F2F] rounded cursor-pointer shrink-0';
        chk.value = opt;
        chk.checked = self.selected.indexOf(opt) > -1;

        chk.addEventListener('change', function(e) {
          e.stopPropagation();
          if (this.checked) {
            if (self.selected.indexOf(opt) === -1) self.selected.push(opt);
          } else {
            self.selected = self.selected.filter(function(v) { return v !== opt; });
          }
          self.updateButton();
          self.onChange(self.selected);
        });

        var span = document.createElement('span');
        span.className = 'truncate text-slate-700 font-medium';
        span.innerText = opt;
        span.title = opt;

        row.appendChild(chk);
        row.appendChild(span);
        self.listContainer.appendChild(row);
      });
    };

    MultiSelect.prototype.filterItems = function(query) {
      var q = (query || '').toLowerCase().trim();
      var labels = this.listContainer.querySelectorAll('label');
      labels.forEach(function(label) {
        var text = label.textContent.toLowerCase();
        label.style.display = (q === '' || text.indexOf(q) > -1) ? 'flex' : 'none';
      });
    };

    MultiSelect.prototype.selectAll = function() {
      this.selected = [...this.options];
      var chks = this.listContainer.querySelectorAll('input[type="checkbox"]');
      chks.forEach(function(c) { c.checked = true; });
      this.updateButton();
      this.onChange(this.selected);
    };

    MultiSelect.prototype.clear = function() {
      this.selected = [];
      var chks = this.listContainer.querySelectorAll('input[type="checkbox"]');
      chks.forEach(function(c) { c.checked = false; });
      this.updateButton();
      this.onChange(this.selected);
    };

    MultiSelect.prototype.getSelected = function() {
      return [...this.selected];
    };

    MultiSelect.prototype.setSelected = function(sel, triggerChange) {
      var self = this;
      if (Array.isArray(sel)) {
        this.selected = sel.filter(function(v) { return self.options.indexOf(v) > -1; });
      } else {
        this.selected = [];
      }
      var chks = this.listContainer.querySelectorAll('input[type="checkbox"]');
      chks.forEach(function(c) {
        c.checked = self.selected.indexOf(c.value) > -1;
      });
      this.updateButton();
      if (triggerChange) {
        this.onChange(this.selected);
      }
    };

    MultiSelect.prototype.updateButton = function() {
      if (this.selected.length === 0 || (this.options.length > 0 && this.selected.length === this.options.length)) {
        this.btnText.innerHTML = `<span class="truncate font-semibold">${this.allLabel}</span>`;
        this.hiddenInput.value = '';
      } else if (this.selected.length === 1) {
        this.btnText.innerHTML = `<span class="truncate font-semibold">${this.selected[0]}</span>`;
        this.hiddenInput.value = this.selected[0];
      } else {
        this.btnText.innerHTML = `<span class="bg-[#D32F2F] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shrink-0">${this.selected.length}</span> <span class="truncate font-semibold">${this.selected.length} geselecteerd</span>`;
        this.hiddenInput.value = this.selected.join(', ');
      }
    };

    window.MultiSelect = MultiSelect;
  })();

  function escapeHtmlValue(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(character) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character];
    });
  }

  function getEmbedVideoUrl(url) {
    if (!url) return "";
    var s = String(url).trim();

    // 1. YouTube detectie (watch?v=, youtu.be/, embed/, shorts/)
    var ytMatch = s.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/i);
    if (ytMatch && ytMatch[1]) {
      return "https://www.youtube.com/embed/" + ytMatch[1] + "?rel=0&autoplay=0";
    }

    // 2. Google Drive detectie (file/d/ID of open?id=ID of uc?id=ID of 25+ tekens ID)
    var driveMatch = s.match(/\/d\/([-\w]{25,})/i) || s.match(/[?&]id=([-\w]{25,})/i) || s.match(/([-\w]{25,})/);
    if (driveMatch && driveMatch[1]) {
      return "https://drive.google.com/file/d/" + driveMatch[1] + "/preview";
    }

    // 3. Indien al een embed url of overige url
    if (s.indexOf("drive.google.com") > -1 && s.indexOf("/preview") === -1) {
      return s.replace(/\/view(\?.*)?$/i, "/preview");
    }

    return s;
  }

  function showModal(m, confirm = false, action = null, isAutoClose = false) {
    document.getElementById('modal-msg').innerText = m; 
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal').style.display = 'flex';
    
    var btnConfirm = document.getElementById('modal-confirm-btn');
    var btnClose = document.querySelector('#modal button.btn-outline');
    
    if (confirm) { 
      btnConfirm.classList.remove('hidden'); 
      btnConfirm.onclick = action; 
    } else { 
      btnConfirm.classList.add('hidden'); 
    }
    
    if (isAutoClose) {
      if (btnClose) {
        btnClose.style.display = 'none';
      }
      setTimeout(function() { 
        closeModal(); 
        if (btnClose) {
          btnClose.style.display = ''; 
        }
      }, 3000);
    } else {
      if (btnClose) {
        btnClose.style.display = '';
      }
    }
  }

         overlay.classList.add('opacity-0');

  }

  function populateImpersonateDropdown() {
    var select = document.getElementById('imp-email-select');

    if ((!tests || tests.length === 0) && typeof google !== 'undefined') {
        ld(true);
        select.innerHTML = '<option value="">-- Data ophalen... een moment geduld --</option>';
        google.script.run
            .withSuccessHandler(function(data) {
                tests = data.tests ? data.tests : data;
                DATA_CACHE.index = data;
                buildDropdownOptions(select);
                ld(false); 
            })
            .withFailureHandler(function(err) {
                ld(false); 
                showModal("Fout bij het ophalen van accounts: " + err.message);
            })
            .getToetsenOverzicht(originalUserEmail);
        return;
    } else {
        buildDropdownOptions(select);
        ld(false); 
    }
  }

  function buildDropdownOptions(selectElement) {
    if (!selectElement) return;
    var emails = new Set();
    
    if (tests) {
      tests.forEach(function(t) { 
        if (t.managerEmail) {
          var ems = String(t.managerEmail).split(/[\n,;]+/);
          ems.forEach(function(e) {
            if (e.trim().indexOf('@') > -1) {
              emails.add(e.trim().toLowerCase());
            }
          });
        } 
      });
    }
    
    var sorted = Array.from(emails).filter(Boolean).sort();
    var options = '<option value="">-- Selecteer of typ... --</option>';
    sorted.forEach(function(e) {
      options += `<option value="${e}">${e}</option>`;
    });
    
    var currentVal = selectElement.value;
    selectElement.innerHTML = options;
    if (currentVal && sorted.indexOf(currentVal) > -1) selectElement.value = currentVal;
    if (isImpersonating && selectElement.id === 'imp-email-select') selectElement.value = userEmail;
  }

        google.script.run
            .withSuccessHandler(function(data) {
                var rights = {
                    isAdmin: data.isAdmin,
                    canCreate: data.canCreate
                };
                
                userEmail = val;
                isImpersonating = true;
                isAdminUser = rights.isAdmin;
                canCreateUser = rights.canCreate;
                
                document.getElementById('header-user-email').innerHTML = `<span class="text-[#D32F2F] font-black">${userEmail}</span>`;

                document.getElementById('imp-status-box').classList.remove('hidden');
                document.getElementById('imp-status-text').innerText = "Je kijkt nu mee als: " + userEmail;
                
                var roleText = isAdminUser ? "BEHEERDER" : (canCreateUser ? "TOETSENMAKER" : "MANAGER");
                document.getElementById('header-user-role').innerText = roleText;

                document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.remove('hidden'); });
                
                if (isAdminUser || canCreateUser) {
                    var sendLink = document.getElementById('link-send');
                    if (sendLink) sendLink.classList.remove('hidden');
                    var indexLink = document.getElementById('link-index');
                    if (indexLink) indexLink.classList.remove('hidden');

                        if (importLink) importLink.classList.remove('hidden');
                    }
                    
                    var impLink = document.getElementById('link-impersonate');
                    if (impLink) impLink.classList.add('hidden'); 
                    
                    if (!isAdminUser) {
                        ['link-aanvragen-wachtrij', 'link-gebruikers', 'link-shared-accounts', 'link-logs', 'link-import'].forEach(function(id) {
                            var el = document.getElementById(id);
                            if (el) el.classList.add('hidden');
                        });

                        if (maintBtn) maintBtn.classList.add('hidden');
                    }
                } else {
                    document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.add('hidden'); });
                    var sendLink = document.getElementById('link-send');
                    if (sendLink) sendLink.classList.add('hidden');
                    var impLink = document.getElementById('link-impersonate');
                    if (impLink) impLink.classList.add('hidden');
                }
                
                showModal("Je kijkt nu mee als: " + userEmail + "\nHuidige rol: " + roleText, false, null, true);
                
                DATA_CACHE = { stats: null, results: null, index: null, dropdowns: null };
                if (typeof pbDataRaw !== 'undefined') pbDataRaw = null; 
                
                show('dashboard', document.getElementById('link-dashboard'));
                ld(false);
            })
            .withFailureHandler(function(err) {
                ld(false);
                showModal("Fout bij ophalen rechten voor impersonate: " + err.message);
            })
            .getToetsenOverzicht(val);

            var rawVideoUrl = (d.meta.videoUrl || "").trim();

            var vContainer = document.getElementById('quiz-video-container');

            var vCountdownText = document.getElementById('video-countdown-text');
            var vCountdownIcon = document.getElementById('video-countdown-icon');
            var vBox = document.getElementById('video-countdown-box');
            
            if (rawVideoUrl && vContainer) {
              quizHasVideo = true;
              videoCompleted = false;
              vContainer.classList.remove('hidden');

              // Knop ALTIJD direct vergrendelen
              if (btnStartNow) {
                btnStartNow.disabled = true;
                btnStartNow.innerText = "BEKIJK EERST DE VIDEO";

              var ytMatch = rawVideoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/i);
              if (ytMatch && ytMatch[1]) {
                // YouTube video: koppel aan de YouTube IFrame Player API
                var ytId = ytMatch[1];
                if (vIframe) vIframe.classList.add('hidden');
                if (ytContainer) ytContainer.classList.remove('hidden');

                if (vCountdownText) vCountdownText.innerText = "Bekijk de YouTube video hierboven. Zodra de video is afgespeeld ontgrendelt de toets!";

                var initYTPlayer = function() {
                  if (typeof YT !== 'undefined' && YT.Player) {
                    if (ytPlayer && ytPlayer.destroy) {
                      try { ytPlayer.destroy(); } catch(e) {}
                    }
                    ytPlayer = new YT.Player('quiz-video-player', {
                      videoId: ytId,
                      playerVars: {
                        rel: 0,
                        modestbranding: 1
                      },
                      events: {
                        'onStateChange': function(ev) {
                          // ev.data === 0 betekent YT.PlayerState.ENDED
                          if (ev.data === 0 || (typeof YT !== 'undefined' && ev.data === YT.PlayerState.ENDED)) {
                            unlockQuizStartButton();
                          }
                        }
                      }
                    });
                  } else {
                    setTimeout(initYTPlayer, 250);
                  }
                };
                initYTPlayer();

                // Indien er tevens een duur is opgegeven, telt een timer mee als visuele indicatie of fallback
                if (videoDuurSec > 0) {
                  var secLeft = videoDuurSec;
                  var updateCountdown = function() {
                    if (videoCompleted) return;
                    if (secLeft <= 0) {
                      unlockQuizStartButton();
                    } else {
                      var minPart = Math.floor(secLeft / 60);
                      var secPart = secLeft % 60;
                      var timeStr = (minPart > 0 ? minPart + "m " : "") + (secPart < 10 && minPart > 0 ? "0" : "") + secPart + "s";
                      if (vCountdownText && !videoCompleted) {
                        vCountdownText.innerText = "Video bekijken... (knop ontgrendelt over " + timeStr + " of bij einde video)";

                      secLeft--;

                  if (videoTimerInterval) clearInterval(videoTimerInterval);
                  videoTimerInterval = setInterval(updateCountdown, 1000);

                var secLeft = videoDuurSec > 0 ? videoDuurSec : 60;
                var updateVideoCountdown = function() {

                    unlockQuizStartButton();

                    var minPart = Math.floor(secLeft / 60);
                    var secPart = secLeft % 60;

                };
                updateVideoCountdown();
                if (videoTimerInterval) clearInterval(videoTimerInterval);

    } else if (mode === "BEHEER") {

        ld(false);

      return;

      ld(true);

    if (typeof google === 'undefined') { 
      setTimeout(function() {

        }
      }, 500); 
      return; 
    }

    var isManualRefresh = (force && !silent);
    
    google.script.run

        renderStats(d);

  function renderStats(d) {
    var isNew = d && d.all && d.perToets;
    
    if (!window.dashMultiSelect && document.getElementById('dash-filter-toets-container') && typeof MultiSelect !== 'undefined') {
      window.dashMultiSelect = new MultiSelect({
        container: 'dash-filter-toets-container',
        id: 'dash-filter-toets',
        placeholder: 'Alle Toetsen',
        allLabel: 'Alle Toetsen',
        styleType: 'boxed',
        onChange: function() { filterDashboard(); }
      });
    }

    if (window.dashMultiSelect && isNew) {
      var keys = Object.keys(d.perToets).sort();
      var currentSel = window.dashMultiSelect.getSelected();
      window.dashMultiSelect.setOptions(keys, currentSel, false);
    } else if (!window.dashMultiSelect) {
      var sel = document.getElementById('dash-filter-toets');
      if (sel && isNew) {
        var c = sel.value; 
        var keys = Object.keys(d.perToets).sort();
        sel.innerHTML = '<option value="">Alle Toetsen</option>' + keys.map(function(k) { return `<option value="${k}">${k}</option>`; }).join('');
        if (keys.indexOf(c) > -1) {
          sel.value = c;
        }
      }
    }
    
    var selectedToetsen = window.dashMultiSelect ? window.dashMultiSelect.getSelected() : [];
    if (selectedToetsen.length === 0 && document.getElementById('dash-filter-toets') && document.getElementById('dash-filter-toets').value) {
      selectedToetsen = [document.getElementById('dash-filter-toets').value];
    }

    var stats;
    var allKeys = (isNew && d.perToets) ? Object.keys(d.perToets) : [];
    if (isNew && selectedToetsen.length > 0 && selectedToetsen.length < allKeys.length) {
      stats = { totaal: 0, bezig: 0, verwerkt: 0, geslaagd: 0, gezakt: 0 };
      selectedToetsen.forEach(function(k) {
        if (d.perToets[k]) {
          stats.totaal += d.perToets[k].totaal || 0;
          stats.bezig += d.perToets[k].bezig || 0;
          stats.verwerkt += d.perToets[k].verwerkt || 0;
          stats.geslaagd += d.perToets[k].geslaagd || 0;
          stats.gezakt += d.perToets[k].gezakt || 0;
        }
      });
    } else {
      stats = isNew ? d.all : d;
    }
    
    var elTot = document.getElementById('stat-tot'); 
    if (elTot) { elTot.innerText = stats.totaal || 0; }
    
    var elBez = document.getElementById('stat-bez'); 
    if (elBez) { elBez.innerText = stats.bezig || 0; }
    
    var elDone = document.getElementById('stat-done'); 
    if (elDone) { elDone.innerText = stats.verwerkt || 0; }
    
    var tot = stats.verwerkt > 0 ? stats.verwerkt : 0;
    var pGes = tot > 0 ? Math.round((stats.geslaagd / tot) * 100) : 0;
    var pGez = tot > 0 ? Math.round((stats.gezakt / tot) * 100) : 0;
    
    var elGesCount = document.getElementById('chart-geslaagd-count'); 
    if (elGesCount) { elGesCount.innerText = stats.geslaagd || 0; }
    
    var elGesCamp = document.getElementById('chart-geslaagd-perc'); 
    if (elGesCamp) { elGesCamp.innerText = pGes + '%'; }
    
    var elGesBar = document.getElementById('chart-geslaagd-bar'); 
    if (elGesBar) { elGesBar.style.width = pGes + '%'; }
    
    var elGezCount = document.getElementById('chart-gezakt-count'); 
    if (elGezCount) { elGezCount.innerText = stats.gezakt || 0; }
    
    var elGezCamp = document.getElementById('chart-gezakt-perc'); 
    if (elGezCamp) { elGezCamp.innerText = pGez + '%'; }
    
    var elGezBar = document.getElementById('chart-gezakt-bar'); 
    if (elGezBar) { elGezBar.style.width = pGez + '%'; }
  }

  function sortTable(col) {
    sortAsc = (sortCol === col) ? !sortAsc : ((col === 'email' || col === 'toetsNaam' || col === 'status') ? true : false);
    sortCol = col;
    
    ['datum','email','toetsNaam','score','norm','status'].forEach(function(c) {
      var el = document.getElementById('sort-icon-'+c);
      if (el) { 
        el.innerText = (c === sortCol) ? (sortAsc ? 'arrow_upward' : 'arrow_downward') : 'unfold_more'; 
        if (c === sortCol) { el.classList.add('text-[#D32F2F]'); } else { el.classList.remove('text-[#D32F2F]'); }
      }
    });
    
    filterResults();
  }

  function filterResults() {
    var selectedToetsen = window.resMultiSelect ? window.resMultiSelect.getSelected() : [];
    if (selectedToetsen.length === 0 && document.getElementById('res-filter-quiz') && document.getElementById('res-filter-quiz').value) {
      selectedToetsen = [document.getElementById('res-filter-quiz').value];
    }
    var dStart = document.getElementById('res-filter-date-start').value;
    var dEnd = document.getElementById('res-filter-date-end').value;
    
    var sEl = document.getElementById('res-filter-search');
    var sVal = sEl ? sEl.value.toLowerCase() : "";
    
    var curr = allResults.filter(function(r) {
      return (selectedToetsen.length === 0 || selectedToetsen.indexOf(r.toetsNaam) > -1) && 
             (!dStart || r.datum >= dStart) && 
             (!dEnd || r.datum <= dEnd) &&
             (!sVal || r.email.toLowerCase().indexOf(sVal) > -1);
    });
    
    curr.sort(function(a, b) {
      var vA = (sortCol === 'datum') ? (a.datumIso ? new Date(a.datumIso).getTime() : 0) : ((sortCol === 'score' || sortCol === 'norm') ? parseFloat(a[sortCol])||0 : String(a[sortCol]||"").toLowerCase());
      var vB = (sortCol === 'datum') ? (b.datumIso ? new Date(b.datumIso).getTime() : 0) : ((sortCol === 'score' || sortCol === 'norm') ? parseFloat(b[sortCol])||0 : String(b[sortCol]||"").toLowerCase());
      
      if (vA === vB && sortCol === 'datum') { 
        vA = a.id; 
        vB = b.id; 
      }
      
      if (vA < vB) return sortAsc ? -1 : 1; 
      if (vA > vB) return sortAsc ? 1 : -1; 
      return 0;
    });

    currentFilteredResults = curr;
    
    var tb = document.getElementById('table-results-all'); 
    if (tb) {
      tb.innerHTML = "";
      curr.forEach(function(r, idx) {
        var c = r.status.indexOf('Geslaagd') > -1 ? 'status-done' : 'status-error';
        
        var deleteBtn = (!isImpersonating && r.canDelete) ? `<button onclick="askDeleteResult(${r.id})" class="text-slate-400 hover:text-red-600 ml-2" title="Resultaat definitief verwijderen"><span class="material-icons text-lg">delete</span></button>` : '';
        var editBtn = (!isImpersonating && (isAdminUser || canCreateUser)) ? `<button onclick="askEditResult(${r.id})" class="text-slate-400 hover:text-blue-600 ml-2" title="Status (Score) Handmatig Aanpassen / Revert to Gezakt"><span class="material-icons text-lg">edit</span></button>` : '';
        
        var hasRightsToResend = isAdminUser || canCreateUser;
        var herkansingBtn = (!isImpersonating && hasRightsToResend && r.status.indexOf('Gezakt') > -1 && r.status.indexOf('toegewezen') === -1) ? `<button onclick="askHerkansing(${r.id})" class="text-slate-400 hover:text-orange-500 ml-2" title="Nieuwe Herkansing Toewijzen"><span class="material-icons text-lg">replay</span></button>` : '';
        
        tb.innerHTML += `
        <tr class="hover:bg-slate-50 transition-colors">
          <td data-label="DATUM" class="text-xs whitespace-nowrap">${escapeHtmlValue(r.displayDatum)}</td>
          <td data-label="DEELNEMER" class="font-bold text-sm">${escapeHtmlValue(r.email)}</td>
          <td data-label="TOETS" class="text-sm">${escapeHtmlValue(r.toetsNaam)}</td>
          <td data-label="SCORE" class="font-bold">${escapeHtmlValue(r.score)}%</td>
          <td data-label="NORM">${escapeHtmlValue(r.norm)}%</td>
          <td data-label="STATUS"><span class="status-badge ${c}">${escapeHtmlValue(r.status)}</span></td>
          <td data-label="ACTIES" style="text-align: right;">
            <div class="flex items-center justify-end gap-2 mt-2 md:mt-0">
              <button onclick="handlePDFRequest(${r.id})" class="text-[#D32F2F] hover:text-[#b71c1c]">
                <span class="material-icons text-lg">description</span>
              </button>
              ${herkansingBtn}
              ${editBtn}
              ${deleteBtn}
            </div>
          </td>
        </tr>`;
      });
    }
  }

  function exportCSV() {
    var selectedToetsen = window.resMultiSelect ? window.resMultiSelect.getSelected() : [];
    var qVal = selectedToetsen.length === 1 ? selectedToetsen[0] : (document.getElementById('res-filter-quiz') ? document.getElementById('res-filter-quiz').value : "");
    var dStart = document.getElementById('res-filter-date-start') ? document.getElementById('res-filter-date-start').value : "";
    var dEnd = document.getElementById('res-filter-date-end') ? document.getElementById('res-filter-date-end').value : "";
    var sEl = document.getElementById('res-filter-search');
    var sVal = sEl ? sEl.value.trim() : "";
    
    var curr = (currentFilteredResults && currentFilteredResults.length > 0) ? currentFilteredResults : [];
    
    if (curr.length === 0 && selectedToetsen.length === 0 && !qVal && !dStart && !dEnd && !sVal) {
      curr = allResults;
    }
    
    if (!curr || curr.length === 0) {
      return showModal("Geen resultaten om te exporteren voor de gekozen selectie.");
    }
    
    var csvContent = "Datum,E-mailadres,Toets,Score,Norm,Status\n"; 
    curr.forEach(function(r) { 
      var safeDate = r.displayDatum ? String(r.displayDatum).replace(/"/g, '""') : (r.datum || '');
      var safeEmail = r.email ? String(r.email).replace(/"/g, '""') : '';
      var safeToetsNaam = r.toetsNaam ? String(r.toetsNaam).replace(/"/g, '""') : '';
      var safeStatus = r.status ? String(r.status).replace(/"/g, '""') : '';
      csvContent += `"${safeDate}","${safeEmail}","${safeToetsNaam}",${r.score}%,${r.norm}%,"${safeStatus}"\n`; 
    });
    
    var blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: "text/csv;charset=utf-8;" }); 
    var link = document.createElement("a"); 
    link.href = URL.createObjectURL(blob); 
    if (selectedToetsen.length === 1) {
      link.download = "Resultaten_" + selectedToetsen[0].replace(/[\\/:*?"<>| ]/g, "_") + ".csv";
    } else if (selectedToetsen.length > 1) {
      link.download = "Resultaten_Geselecteerd_" + selectedToetsen.length + "_Toetsen.csv";
    } else if (qVal) {
      link.download = "Resultaten_" + qVal.replace(/[\\/:*?"<>| ]/g, "_") + ".csv";
    } else {
      link.download = "Resultaten_Export.csv"; 
    }
    link.click();
  }

  }

  function generateGroupReport() {
    var t = document.getElementById('gr-toets').value;
    var ems = Array.from(document.querySelectorAll('.gr-email-cb:checked')).map(function(cb) { return cb.value; });
    
    if (!t) {
      return showModal("Selecteer eerst een toets.");
    }
    if (ems.length === 0) {
      return showModal("Selecteer minimaal één deelnemer om het rapport te genereren.");
    }
    
    var dStart = document.getElementById('gr-start').value;
    var dEnd = document.getElementById('gr-end').value;
    
    var reportData = allResults.filter(function(r) { 
      return r.toetsNaam === t && (ems.indexOf(r.email) > -1) && (!dStart || r.datum >= dStart) && (!dEnd || r.datum <= dEnd); 
    });
    
    if (reportData.length === 0) {
      return showModal("Geen data gevonden.");
    }
    
    var qStats = {};
    reportData.forEach(function(r) {
      var det = parseDetailsRobustly(r.details);
      det.forEach(function(q) {
        if (!qStats[q.question]) {
          qStats[q.question] = { question: q.question, total: 0, incorrect: 0 };
        }
        qStats[q.question].total++; 
        
        if (!q.isCorrect) {
          qStats[q.question].incorrect++;
        }
      });
    });
    
    closeGroupReportModal(); 
    ld(true); 
    
    var badQuestions = Object.values(qStats).filter(function(q) { return q.incorrect > 0; }).sort(function(a, b) { return b.incorrect - a.incorrect; });
    var payload = { 
      toets: t, 
      email: ems.join(', '), 
      start: dStart, 
      end: dEnd, 
      results: reportData, 
      questionStats: badQuestions 
    };
    
    if (typeof google === 'undefined') { 
      setTimeout(function() { ld(false); showModal("Preview: Rapport gegenereerd."); }, 500); 
      return; 
    }
    
    google.script.run
      .withSuccessHandler(function(res) {
        ld(false); 
        currentPDFBase64 = res.base64; 
        isGroupReport = true; 
        currentGroupPayload = payload;
        renderGroupHTMLPreview(payload); 
        document.getElementById('pdf-modal').classList.remove('hidden');
        document.getElementById('pdf-modal').style.display = 'flex';
      })
      .withFailureHandler(function(err) { 
        ld(false); 
        showModal("Fout bij genereren: " + err.message); 
      })
      .getGroupReportPDFBase64(payload);
  }

  function handlePDFRequest(id) {
    isGroupReport = false;
    var r = null;
    for(var i=0; i<allResults.length; i++) {
       if (allResults[i].id === id) { r = allResults[i]; break; }
    }
    if (!r) return;

    finalResultData = {
      userEmail: r.email,
      toetsNaam: r.toetsNaam,
      norm: r.norm,
      datum: r.displayDatum,
      score: r.score,
      correct: r.correct,
      total: r.total,
      finalStatus: r.status,
      toetsId: r.toetsId,
      details: parseDetailsRobustly(r.details)
    };

    renderHTMLPreview(finalResultData);
    document.getElementById('pdf-modal').classList.remove('hidden');
    document.getElementById('pdf-modal').style.display = 'flex';
    currentPDFBase64 = null;
  }

  function lTests(force, silent) {
    if (typeof silent === 'undefined') silent = false;
    if (!force && DATA_CACHE.index) { 
      tests = DATA_CACHE.index; 
      renderIndex(); 
      if (!silent) ld(false); 
      return; 
    }
    
    if (!silent) ld(true); 
    if (typeof google === 'undefined') { 
      setTimeout(function() { tests = []; renderIndex(); if (!silent) ld(false); }, 500); 
      return; 
    }
    
    google.script.run
      .withSuccessHandler(function(d) { 
        DATA_CACHE.index = d.tests ? d.tests : d; 
        tests = d.tests ? d.tests : d; 
        
        canCreateUser = d.canCreate !== undefined ? d.canCreate : isAdminUser;
        
        renderIndex(); 
        if (!silent) ld(false); 
      })
      .withFailureHandler(function(err) { 
        if (!silent) {
          ld(false); 
          showModal("Fout bij laden toetsen: " + err.message); 
        }
      })
      .getToetsenOverzicht(userEmail);

  function askEditResult(id) {
    var r = allResults.find(function(x) { return x.id === id; });
    if (!r) return;
    
    var isGezakt = r.status.indexOf('Gezakt') > -1;
    var promptMsg = "";
    
    if (isGezakt) {
       promptMsg = `Resultaat aanpassen voor ${r.email}. Huidige status is: GEZAKT.\n\nKlik op 'Bevestigen' om dit handmatig te wijzigen naar GESLAAGD.`;
       showModal(promptMsg, true, function() {
          closeModal();
          showModal("Wordt op de achtergrond aangepast naar Geslaagd...", false, null, true);
          r.status = 'Geslaagd';
          filterResults();
          if (typeof google !== 'undefined') {
            google.script.run.updateResultaatStatus(r.toetsId, r.email, r.sid, 'Geslaagd');
          }
       });
    } else {
       promptMsg = `Resultaat aanpassen voor ${r.email}. Huidige status is: ${r.status.toUpperCase()}.\n\nKies de nieuwe status door op de knop te klikken:`;
       
       document.getElementById('modal-msg').innerText = promptMsg; 
       document.getElementById('modal').classList.remove('hidden');
       document.getElementById('modal').style.display = 'flex';
       
       var btnConfirm = document.getElementById('modal-confirm-btn');
       var btnClose = document.querySelector('#modal button.btn-outline');
       
       btnConfirm.classList.remove('hidden');
       btnConfirm.innerText = "Zet op GEZAKT";
       btnConfirm.onclick = function() {
           closeModal();
           btnConfirm.innerText = "Bevestigen"; 
           showModal("Wordt op de achtergrond aangepast naar Gezakt...", false, null, true);
           r.status = 'Gezakt';
           filterResults();
           if (typeof google !== 'undefined') {
             google.script.run.updateResultaatStatus(r.toetsId, r.email, r.sid, 'Gezakt');
           }
       };
       
       if (btnClose) {
         btnClose.style.display = '';
         btnClose.innerText = "Annuleren";
         btnClose.onclick = function() {
            closeModal();
            btnClose.innerText = "Sluiten"; 
         };
       }
    }
  }

  function addQuestionItem() { 
    editQuizData = collectQuizDataFromForm();

  function askRemoveQ(i) { 
    showModal("Weet je zeker dat je deze vraag definitief wilt verwijderen?", true, function() { closeModal(); removeQ(i); }); 
  }
  
  function removeQ(i) { 
    editQuizData = collectQuizDataFromForm();
    var urlInput = document.getElementById(`q-img-${i}`); 
    if (urlInput && urlInput.value) { 
      if (typeof google !== 'undefined') {
      google.script.run
        .withFailureHandler(function(err) { showModal("Afbeelding verwijderen mislukt: " + err.message); })
        .deleteImageFromDrive(urlInput.value, editQuizData && editQuizData.meta ? editQuizData.meta.id : "");
      }
    } 
    editQuizData.vragen.splice(i, 1); 
    renderEditor(); 
  }
  
  function askRemoveAfbeelding(index) { 
    showModal("Weet je zeker dat je deze afbeelding wilt verwijderen?", true, function() { closeModal(); removeAfbeelding(index); }); 
  }
  
  function removeAfbeelding(index) { 
    var urlInput = document.getElementById(`q-img-${index}`); 
    if (urlInput && urlInput.value) { 
      if (typeof google !== 'undefined') {
      google.script.run
        .withFailureHandler(function(err) { showModal("Afbeelding verwijderen mislukt: " + err.message); })
        .deleteImageFromDrive(urlInput.value, editQuizData && editQuizData.meta ? editQuizData.meta.id : "");
      }
    } 
    document.getElementById(`q-img-${index}`).value = ""; 
    document.getElementById(`file-upload-${index}`).value = ""; 
    document.getElementById(`img-preview-${index}`).innerHTML = '<span class="material-icons text-slate-300 text-sm">image</span>'; 
  }

  function uploadFile(input, index) {
    if (!input.files || input.files.length === 0) return;
    
    var file = input.files[0];
    var toetsNaam = document.getElementById('ed-naam').value;
    
    if (!toetsNaam || toetsNaam.trim() === "") { 
        if (!isAanvragerMode) {
            showModal("Vul eerst een 'Naam Toets' in bovenaan de editor, zodat de foto in de juiste map komt."); 
            input.value = ""; 
            return; 
        } else {
            toetsNaam = "Concept_Aanvraag"; 
        }
    }
    
    var reader = new FileReader(); 
    var previewDiv = document.getElementById(`img-preview-${index}`);
    
    previewDiv.innerHTML = '<span class="material-icons animate-spin text-[#D32F2F] text-[20px]" style="animation: spin 1s linear infinite;">autorenew</span>';
    
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      
      google.script.run
        .withSuccessHandler(function(url) { 
          document.getElementById(`q-img-${index}`).value = url; 
          var thumbUrl = getDriveThumbUrl(url); 
          previewDiv.innerHTML = `
            <div class="img-hover-wrap flex items-center justify-center w-full h-full cursor-help relative" onmouseenter="this.querySelector('.hover-preview').style.display='block'" onmouseleave="this.querySelector('.hover-preview').style.display='none'">
              <span class="material-icons text-[#2E7D32]">image</span>
              <div class="hover-preview absolute bottom-full mb-2 right-0 z-[100] bg-white border border-slate-200 shadow-2xl p-2 rounded" style="display:none; width:max-content;">
                <img src="${thumbUrl}" style="max-width:300px; max-height:300px; object-fit:contain; display:block;">
              </div>
            </div>`; 
        })
        .withFailureHandler(function(err) { 
          previewDiv.innerHTML = '<span class="material-icons text-red-500 text-sm">error</span>'; 
          showModal("Fout bij uploaden van de afbeelding: " + err.message); 
        })
        .uploadImageToDrive(base64, file.name, file.type, toetsNaam, isAanvragerMode);
    };
    
    reader.readAsDataURL(file);
  }

  function collectQuizDataFromForm() {
    var manNamesArr = [];
    var manEmailsArr = [];
    var manRows = document.querySelectorAll('.manager-row');
    for (var m = 0; m < manRows.length; m++) {
      var n = manRows[m].querySelector('.ed-man-naam-input').value.trim();
      var e = manRows[m].querySelector('.ed-man-email-input').value.trim();
      if (n || e) {
        manNamesArr.push(n);
        manEmailsArr.push(e);
      }
    }

    var meta = {
      id: editQuizData.meta.id, 
      rowIndex: editQuizData.meta.rowIndex,
      naam: document.getElementById('ed-naam').value,
      desc: document.getElementById('ed-desc').value,
      regio: document.getElementById('ed-regio').value,
      klantnaam: document.getElementById('ed-klant').value,
      manName: manNamesArr.join(', '),
      manEmail: manEmailsArr.join(', '),
      norm: document.getElementById('ed-norm').value,
      stuurManagerMail: document.getElementById('ed-stuur-manager-mail').checked,
      toonAntwoorden: document.getElementById('ed-toon-antwoorden') ? document.getElementById('ed-toon-antwoorden').checked : true,
      videoUrl: document.getElementById('ed-video-url') ? document.getElementById('ed-video-url').value.trim() : (editQuizData.meta.videoUrl || ""),
      videoDuur: document.getElementById('ed-video-duur') ? (parseInt(document.getElementById('ed-video-duur').value, 10) || 0) : (editQuizData.meta.videoDuur || 0)
    };

    var qRows = document.getElementById('ed-questions').children;
    var nV = [];

    for(var i=0; i<qRows.length; i++) {
      nV.push({
        vraag: qRows[i].querySelector('.q-input-text').value,
        o1: qRows[i].querySelector('.q-opt-1').value,
        o2: qRows[i].querySelector('.q-opt-2').value,
        o3: qRows[i].querySelector('.q-opt-3').value,
        o4: qRows[i].querySelector('.q-opt-4').value,
        correct: qRows[i].querySelector('.q-corr').value,
        img: qRows[i].querySelector('.q-img').value,
        uitleg: qRows[i].querySelector('.q-uitleg').value,
        verplicht: qRows[i].querySelector('.q-verplicht').checked
      });
    }
    return { meta: meta, vragen: nV };
  }
  
  function saveQuiz() {
    var data = collectQuizDataFromForm();
    
    if (!data.meta.naam || !data.meta.regio || !data.meta.klantnaam) {
      return showModal("Naam, Regio en Klantnaam zijn verplicht.");
    }
    
    showModal("Toets wordt razendsnel op de achtergrond opgeslagen!", false, null, true);
    show('index', document.getElementById('link-index')); 
    
    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(function() {
          DATA_CACHE.index = null; 
          lTests(true); 
        })
        .saveQuizChanges(data);
    }
  }
  
  function submitAanvraag() {
    var data = collectQuizDataFromForm();

    if (!data.meta.naam || !data.meta.regio || !data.meta.klantnaam) {
      return showModal("Naam Toets, Regio en Klantnaam zijn verplicht voor het indienen.");
    }

    if (data.vragen.length === 0) {
        return showModal("Voeg minimaal één vraag toe voordat je indient.");
    }

    var btn = document.getElementById('btn-submit-aanvraag');
    var orgHtml = "";
    if (btn) {
        orgHtml = btn.innerHTML;
        btn.innerHTML = '<span class="material-icons animate-spin mr-2">autorenew</span> Aanvraag Indienen...';
        btn.disabled = true;
        btn.classList.replace('bg-[#2E7D32]', 'bg-slate-400');
    }

    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(function() {
          show('aanvrager-dash');
          document.getElementById('aanvrager-success-msg').classList.remove('hidden');
          var cLijst = document.getElementById('concepten-lijst');
          if (cLijst) cLijst.classList.remove('hidden');
          loadConceptenLijst(); 
          window.scrollTo(0,0);
        })
        .withFailureHandler(function(err) {
          if (btn) {
              btn.innerHTML = orgHtml;
              btn.disabled = false;
              btn.classList.replace('bg-slate-400', 'bg-[#2E7D32]');
          }
          showModal("Fout bij indienen: " + err.message);
        })
        .submitNieuweAanvraag(data);
    }
  }

  function saveConcept() {
      var data = collectQuizDataFromForm();
      editQuizData = data; 
      
      var btn = document.getElementById('btn-save-concept');
      var orgText = "";
      if (btn) {
          orgText = btn.innerHTML;

          btn.disabled = true;

  }

  function openAanvragerImportModal() {
      document.getElementById('inp-aanvrager-url').value = '';
      document.getElementById('modal-aanvrager-import').classList.remove('hidden');
      document.getElementById('modal-aanvrager-import').style.display = 'flex';
  }

  function closeAanvragerImportModal() {
      document.getElementById('modal-aanvrager-import').classList.add('hidden');
      document.getElementById('modal-aanvrager-import').style.display = 'none';
  }

  function doAanvragerImport() {
      var u = document.getElementById('inp-aanvrager-url').value;
      if (!u) return showModal("Plak eerst een geldige Google Sheets link in het invoerveld.");

      var btn = document.getElementById('btn-aanvrager-import');
      var orgHtml = btn.innerHTML;
      btn.innerHTML = '<span class="material-icons animate-spin mr-2">autorenew</span> Verwerken...';
      btn.disabled = true;

      if (typeof google !== 'undefined') {
          google.script.run
              .withSuccessHandler(function(r) {
                  btn.innerHTML = orgHtml;
                  btn.disabled = false;
                  closeAanvragerImportModal();
                  
                  if (r.success) {
                      document.getElementById('aanvrager-success-msg').classList.remove('hidden');
                      document.getElementById('aanvrager-success-text').innerHTML = `
                          <h3 class="font-bold text-lg">Template succesvol ingediend!</h3>
                          <p class="text-sm">We hebben de data uitgelezen. Het beheerteam heeft jouw toets ontvangen en zal deze beoordelen.</p>
                      `;
                      window.scrollTo(0,0);
                  } else {
                      showModal(r.message);
                  }
              })
              .withFailureHandler(function(err) {
                  btn.innerHTML = orgHtml;
                  btn.disabled = false;
                  showModal("Fout bij importeren: " + err.message);
              })
              .importeerAanvraagVanuitTemplate(u);
      }
  }

  function toggleAccountType() {
    var accType = document.getElementById('s-acctype').value;
    var repInput = document.getElementById('s-rep');
    var repLabel = document.getElementById('lbl-s-rep');
    
    if (accType === 'Gedeeld') {
      repInput.value = "";
      repInput.disabled = true;
      repInput.classList.add('bg-slate-200', 'cursor-not-allowed', 'text-slate-400');
      repLabel.classList.add('text-slate-400');
      repLabel.innerText = "Herhaling (Niet mogelijk)";
    } else {
      repInput.disabled = false;
      repInput.classList.remove('bg-slate-200', 'cursor-not-allowed', 'text-slate-400');
      repLabel.classList.remove('text-slate-400');
      repLabel.innerText = "Herhaling (Dagen)";
      if(repInput.value === "") repInput.value = "0";
    }
  }

  function syncTime() {
    var numInp = document.getElementById('s-num');
    var timeInp = document.getElementById('s-time');
    if (numInp && timeInp) {
      timeInp.value = numInp.value;
    }
  }

  function updS() {
    var t = null;
    var sVal = document.getElementById('send-toets').value;
    for(var i=0; i<tests.length; i++) {
      if (tests[i].id == sVal) { t = tests[i]; break; }
    }
    
    if (t) {
      document.getElementById('inf-man').innerText = t.managerName || "-"; 
      document.getElementById('s-sc').value = t.norm;
      
      var numInp = document.getElementById('s-num'); 
      numInp.min = t.vragen_verplicht || 1; 
      numInp.max = t.vragen_totaal; 
      numInp.value = t.vragen_totaal;
      
      document.getElementById('inf-tot').innerText = t.vragen_totaal; 
      
      var timeInp = document.getElementById('s-time'); 
      if (timeInp) {
        timeInp.value = t.vragen_totaal;
      }

      document.getElementById('s-acctype').value = "Persoonlijk";
      toggleAccountType();
    }
  }

  function doSend() { 
    var isGedeeld = document.getElementById('s-acctype').value === 'Gedeeld';
    
    var rawEmails = document.getElementById('send-emails').value.split(/[\n,;]+/);
    var validCount = 0;
    for (var e = 0; e < rawEmails.length; e++) {
      if (rawEmails[e].trim() !== "") validCount++;
    }
    
    if (validCount > 100) {
      return showModal("Let op: Je probeert " + validCount + " e-mails in één keer te versturen. Het maximum is 100 per keer om te voorkomen dat de server overbelast raakt. Splits de lijst a.u.b. op in kleinere delen.");
    }

    var c = { 
      toetsId: document.getElementById('send-toets').value, 
      emails: document.getElementById('send-emails').value, 
      aantalVragen: parseInt(document.getElementById('s-num').value) || 0, 
      minScore: parseInt(document.getElementById('s-sc').value), 
      maxTijd: parseFloat(document.getElementById('s-time').value) || 0, 
      herhaling: isGedeeld ? "" : document.getElementById('s-rep').value, 
      ccEmails: document.getElementById('s-cc').value,
      accType: document.getElementById('s-acctype').value 
    };
    
    if (!c.toetsId || !c.emails) {
      return showModal("Vul toets en e-mails in.");
    }
    
    showModal("De uitnodigingen worden razendsnel op de achtergrond verwerkt!", false, null, true);
    
    document.getElementById('send-toets').value = ""; 
    document.getElementById('send-emails').value = ""; 
    document.getElementById('s-cc').value = "";
    document.getElementById('s-res').innerHTML = "<div class='card p-4 status-open' style='color:black'>Uitnodigingen worden verwerkt...</div>";
    
    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(function(r) { 
          if (r.success) {
            var html = "<div class='card p-4 status-done' style='color:black'><b>" + r.message + "</b></div>";
            if (r.isValidationError) {
              html += "<div class='card p-4 status-error mt-4' style='color:black'><b class='text-[#D32F2F]'>Let op! Deels overgeslagen:</b><br>De volgende e-mailadressen komen niet voor in de database (of missen @nl.g4s.com) en zijn niet verstuurd:<ul class='list-disc list-inside mt-2 text-sm text-red-800 font-medium'>";
              r.invalidEmails.forEach(function(em) { html += "<li>" + em + "</li>"; });
              html += "</ul></div>";
            }
            document.getElementById('s-res').innerHTML = html;
          } else if (r.isValidationError) {
            var errHtml = "<div class='card p-4 status-error' style='color:black'><b class='text-[#D32F2F]'>Let op! Ongeautoriseerde accounts:</b><br>Geen enkele uitnodiging verstuurd. De volgende e-mailadressen komen niet voor in de database:<ul class='list-disc list-inside mt-2 text-sm text-red-800 font-medium'>";
            r.invalidEmails.forEach(function(em) { errHtml += "<li>" + em + "</li>"; });
            errHtml += "</ul></div>";
            document.getElementById('s-res').innerHTML = errHtml;
          } else {
            document.getElementById('s-res').innerHTML = "<div class='card p-4 status-error' style='color:black'>Fout: " + r.message + "</div>";
          }
        })
        .withFailureHandler(function(err) { 
          document.getElementById('s-res').innerHTML = "<div class='card p-4 status-error' style='color:black'>Fout op achtergrond: " + err.message + "</div>"; 
        })
        .genereerEnVerstuur(c); 
    }
  }

  function toggleTimer() {
    quizTimerHidden = !quizTimerHidden;
    var txt = document.getElementById('quiz-timer-text');
    var icon = document.getElementById('quiz-timer-icon');
    if (quizTimerHidden) {
        txt.style.display = 'none';
        icon.innerText = 'visibility';
    } else {
        txt.style.display = 'inline';
        icon.innerText = 'visibility_off';
    }
  }

  function startTimerDisplay() {
    var maxMins = parseFloat(quiz.meta.maxTijd) || 0;
    if (maxMins <= 0) return;

    var endTime = startTime.getTime() + (maxMins * 60000);

    function update() {
        var now = new Date().getTime();
        var diff = endTime - now;
        var txt = document.getElementById('quiz-timer-text');
        if (!txt) return;

        if (diff <= 0) {
            txt.innerText = "Tijd is verstreken!";
            txt.style.color = '#B91C1C';
            if(quizTimerInterval) clearInterval(quizTimerInterval);
        } else {
            var minsLeft = Math.ceil(diff / 60000);
            if (minsLeft === 1) {
               txt.innerText = "Minder dan 1 minuut over";
               txt.style.color = '#EA580C';
            } else {
               txt.innerText = "Nog " + minsLeft + " minuten";
               txt.style.color = '#D32F2F';
            }
        }
    }

    update();
    if (quizTimerInterval) clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(update, 1000);
  }

  function startQuiz() {
    if (quizHasVideo && !videoCompleted) {
      return showModal("Bekijk eerst de instructievideo volledig voordat je de toets kunt starten.");
    }
    userEmailNaam = "";

    if (ytPlayer && ytPlayer.stopVideo) {
      try { ytPlayer.stopVideo(); } catch(e) {}
    }
    if (videoTimerInterval) clearInterval(videoTimerInterval);
    var vIframe = document.getElementById('quiz-video-iframe');
    if (vIframe) vIframe.src = "";

    startTime = new Date(); 
    document.getElementById('quiz-start').classList.add('hidden');
    
    var c = document.getElementById('quiz-questions'); 
    c.innerHTML = ""; 
    c.classList.remove('hidden');

    var maxMins = parseFloat(quiz.meta.maxTijd) || 0;
    if (maxMins > 0) {
       c.innerHTML += `
       <div id="quiz-timer-container" style="background-color: #FEF2F2; border: 2px solid #D32F2F; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 10px; color: #D32F2F; font-weight: bold; font-size: 18px;">
             <span class="material-icons">timer</span>
             <span id="quiz-timer-text">Tijd berekenen...</span>
          </div>
          <button onclick="toggleTimer()" style="background: none; border: none; color: #D32F2F; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 12px; text-transform: uppercase;">
             <span class="material-icons" id="quiz-timer-icon">visibility_off</span> <span class="hidden sm:inline">Verberg</span>
          </button>
       </div>`;
    }
    
    quiz.vragen.forEach(function(q, i) {
      var isMulti = q.multipleAnswers === true;
      var type = isMulti ? "checkbox" : "radio";
      
      var optHtml = '';
      q.opties.forEach(function(o, oi) {
        optHtml += `
          <label class="flex items-center p-4 border rounded-lg mb-2 hover:bg-slate-50 cursor-pointer">
            <input type="${type}" name="q${i}" value="${oi+1}" class="mr-4 w-5 h-5 shrink-0 accent-[#D32F2F]">
            <span class="font-medium text-slate-700">${escapeHtmlValue(o)}</span>
          </label>`;
      });
      
      var badgeHtml = isMulti ? '<p class="text-xs text-[#D32F2F] bg-red-50 inline-block px-2 py-1 rounded mb-4 font-bold">Meerdere antwoorden mogelijk</p>' : '';
      var imgHtml = q.afbeelding ? `<img src="${escapeHtmlValue(q.afbeelding)}" class="mb-6 max-w-full rounded border">` : '';
      
      c.innerHTML += `
        <div id="q-block-${i}" class="card p-8 ${i===0 ? '' : 'hidden'}">
          <div class="text-sm font-bold text-slate-400 uppercase mb-4">Vraag ${i+1} van ${quiz.vragen.length}</div>
          <h3 class="font-bold text-xl mb-4">${escapeHtmlValue(q.vraag)}</h3>
          ${badgeHtml}
          ${imgHtml}
          <div>${optHtml}</div>
        </div>`;
    });
    
    c.innerHTML += `
      <div class="flex gap-4 mt-6">
        <button id="btn-prev" onclick="navQuiz(-1)" class="btn-outline w-full py-4 hidden">Vorige</button>
        <button id="btn-next" onclick="navQuiz(1)" class="btn-primary w-full py-4">Volgende</button>
        <button id="btn-submit" onclick="submitQuiz()" class="btn-primary w-full py-4 hidden" style="background:#2E7D32">Inleveren</button>
      </div>`;
      
    updateQuizNav();

    if (maxMins > 0) {
        startTimerDisplay();
    }
  }

  function navQuiz(dir) { 
    document.getElementById(`q-block-${currentQuestionIndex}`).classList.add('hidden'); 
    currentQuestionIndex += dir; 
    document.getElementById(`q-block-${currentQuestionIndex}`).classList.remove('hidden'); 
    
    updateQuizNav(); 
    window.scrollTo({top:0, behavior:'smooth'}); 
  }
  
  function updateQuizNav() { 
    document.getElementById('btn-prev').classList[currentQuestionIndex===0 ? 'add' : 'remove']('hidden'); 
    var isLast = currentQuestionIndex === quiz.vragen.length - 1; 
    
    document.getElementById('btn-next').classList[isLast ? 'add' : 'remove']('hidden'); 
    document.getElementById('btn-submit').classList[isLast ? 'remove' : 'add']('hidden'); 
  }

  function submitQuiz() {
    for (var i = 0; i < quiz.vragen.length; i++) { 
      if (!document.querySelector(`input[name="q${i}"]:checked`)) { 
        showModal(`Let op: Je hebt vraag ${i+1} nog niet beantwoord.`); 
        
        document.getElementById(`q-block-${currentQuestionIndex}`).classList.add('hidden'); 
        currentQuestionIndex = i; 
        document.getElementById(`q-block-${currentQuestionIndex}`).classList.remove('hidden'); 
        
        updateQuizNav(); 
        return; 
      } 
    }

    if (quizTimerInterval) {
       clearInterval(quizTimerInterval);
    }
    
    var answers = [];
    quiz.vragen.forEach(function(q, i) {
      var checkedInputs = Array.from(document.querySelectorAll(`input[name="q${i}"]:checked`)); 
      answers.push({
        questionId: q.id,
        values: checkedInputs.map(function(el) { return el.value; })
      });
    });

    var submitTime = new Date();
    var clientDuurSec = startTime ? Math.max(0, Math.round((submitTime.getTime() - startTime.getTime()) / 1000)) : 0;

    finalResultData = { 
      startTijd: startTime.toISOString(), 
      duurSec: clientDuurSec,
      answers: answers,
      sid: sidFromServer, 
      attemptToken: quizAttemptToken,
      kandidaatNaam: userEmailNaam
    };
    
    document.getElementById('quiz-questions').classList.add('hidden'); 
    document.getElementById('quiz-finish').classList.remove('hidden'); 
    document.getElementById('result-text').innerText = "Je inzending wordt gecontroleerd en opgeslagen...";
    document.getElementById('insight-container').innerHTML = "";
    window.scrollTo({top:0, behavior:'smooth'}); 

    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler(function(result) {
          finalResultData.score = result.score;
          finalResultData.correct = result.correct;
          finalResultData.total = result.total;
          finalResultData.details = result.details;
          finalResultData.toetsNaam = quiz.meta.naam;
          finalResultData.toetsId = tIdFromServer;
          finalResultData.norm = result.norm;
          finalResultData.finalStatus = result.finalStatus;
          finalResultData.datum = new Date().toLocaleDateString('nl-NL');

          document.getElementById('result-text').innerHTML = `Score: ${result.score}% (Minimaal benodigd: ${result.norm}%). Status: ${result.finalStatus}<br><span class="text-sm font-normal mt-2 inline-block text-slate-500">Gemaakt op: ${finalResultData.datum}</span>`;

          var toonAntw = (quiz.meta.toonAntwoorden !== false && String(quiz.meta.toonAntwoorden).toUpperCase() !== "FALSE");
          var insightHtml = result.details.map(function(detail) {
            var uitlegHtml = detail.uitleg ? `<div class="mt-2 text-xs text-slate-600 italic bg-white/50 p-2 rounded border border-slate-200"><b>Uitleg:</b> ${escapeHtmlValue(detail.uitleg)}</div>` : '';
            var correctHtml = (detail.isCorrect || !toonAntw) ? '' : '<br><b style="color:#D32F2F;font-size:12px;">Correct: ' + escapeHtmlValue(detail.correctAnswer) + '</b>';
            return `<div class="p-4 border-b ${detail.isCorrect ? 'bg-green-50' : 'bg-red-50'}"><b>${escapeHtmlValue(detail.question)}</b><br><span class="text-sm">Jouw antwoord: ${escapeHtmlValue(detail.givenAnswer)}</span> ${correctHtml}${uitlegHtml}</div>`;
          }).join('');
          document.getElementById('insight-container').innerHTML = insightHtml;
        })
        .withFailureHandler(function(err) {
          document.getElementById('result-text').innerText = "Je inzending kon niet definitief worden opgeslagen. Neem contact op met beheer.\nFout: " + err.message;
        })
        .submitQuizResult(finalResultData, tIdFromServer);
    }
  }
</script>
